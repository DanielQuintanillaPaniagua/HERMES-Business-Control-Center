{% extends "base.html" %}

{% block title %}Detalle Envío - HERMES{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/shipments.css') }}">
{% endblock %}

{% block body_content %}
<div class="container-fluid envios-page" data-bs-theme="dark">

    <div class="mb-4">
        <a href="{{ url_for('shipments_ui.list_page') }}" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left"></i> Volver a envíos
        </a>
    </div>

    <div class="detalle-envio">
        <div class="detalle-card" id="detalle-envio-card" data-envio-id="{{ envio_id }}">
            <div class="detalle-body text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-3 text-muted">Cargando envío...</p>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/shipments.js') }}"></script>
{% endblock %}

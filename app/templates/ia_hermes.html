{% extends "base.html" %}

{% block title %}IA HERMES{% endblock %}

{% block extra_css %}
<style>
    .chat-wrapper {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 72px - 48px);
        max-height: 720px;
    }

    .chat-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 16px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--hermes-border);
    }

    .chat-header .avatar-ia {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--hermes-gold), #8a6d1f);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        color: #000;
    }

    .chat-mensajes {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 8px 4px 16px;
    }

    .msg {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 0.92rem;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    .msg-usuario {
        align-self: flex-end;
        background: var(--hermes-gold);
        color: #000;
        border-bottom-right-radius: 4px;
    }

    .msg-ia {
        align-self: flex-start;
        background: var(--hermes-panel-2);
        border: 1px solid var(--hermes-border);
        color: var(--hermes-text);
        border-bottom-left-radius: 4px;
    }

    .msg-ia.error {
        border-color: rgba(220, 53, 69, 0.4);
        color: #ff8a94;
    }

    .typing-dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--hermes-text-muted);
        margin: 0 2px;
        animation: typing 1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
        animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
        animation-delay: 0.3s;
    }

    @keyframes typing {

        0%,
        60%,
        100% {
            opacity: 0.3;
        }

        30% {
            opacity: 1;
        }
    }

    .chat-sugerencias {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
    }

    .chip-sugerencia {
        background: var(--hermes-panel-2);
        border: 1px solid var(--hermes-border);
        color: var(--hermes-text);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .chip-sugerencia:hover {
        border-color: var(--hermes-gold);
        color: var(--hermes-gold);
    }

    .chat-input-bar {
        display: flex;
        gap: 10px;
        border-top: 1px solid var(--hermes-border);
        padding-top: 16px;
    }

    .chat-input-bar input {
        flex: 1;
        background: var(--hermes-panel-2);
        border: 1px solid var(--hermes-border);
        border-radius: 10px;
        padding: 12px 16px;
        color: var(--hermes-text);
        outline: none;
        font-size: 0.9rem;
    }

    .chat-input-bar input:focus {
        border-color: var(--hermes-gold);
    }

    .btn-enviar {
        background: var(--hermes-gold);
        color: #000;
        border: none;
        border-radius: 10px;
        width: 46px;
        font-size: 1.1rem;
    }

    .btn-enviar:disabled {
        opacity: 0.5;
    }
</style>
{% endblock %}

{% block content %}
<div class="metric-card chat-wrapper">
    <div class="chat-header">
        <div class="avatar-ia"><i class="bi bi-stars"></i></div>
        <div>
            <h6 class="mb-0 text-white">HERMES AI</h6>
            <small style="color: var(--hermes-text-muted);">Asistente virtual · en línea</small>
        </div>
    </div>

    <div class="chat-mensajes" id="chatMensajes">
        <div class="msg msg-ia">
            Hola {{ current_user.username }}, soy HERMES AI 👋 ¿En qué puedo ayudarte hoy?
        </div>
    </div>

    <div class="chat-sugerencias" id="chatSugerencias">
        <button class="chip-sugerencia">¿Cuántos pedidos tenemos atrasados?</button>
        <button class="chip-sugerencia">Resumen de ventas de la semana</button>
        <button class="chip-sugerencia">¿Qué clientes compran más seguido?</button>
        <button class="chip-sugerencia">Compara envíos del mes anterior</button>
    </div>

    <div class="chat-input-bar">
        <input type="text" id="chatInput" placeholder="Escribe tu consulta aquí..." autocomplete="off">
        <button class="btn-enviar" id="btnEnviarChat"><i class="bi bi-send-fill"></i></button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/ia_hermes.js') }}"></script>
{% endblock %}

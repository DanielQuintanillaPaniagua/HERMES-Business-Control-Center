{% extends "base.html" %}

{% block title %}{{ titulo }} - HERMES{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 60vh;">
    <div class="metric-icon-circle icon-ingresos mb-4" style="width:72px; height:72px; font-size:2rem;">
        <i class="bi {{ icono }}"></i>
    </div>
    <h2 class="text-white fw-bold mb-2">{{ titulo }}</h2>
    <p style="color: var(--hermes-text-muted); max-width: 420px;">{{ descripcion }}</p>
    <div class="mt-3">
        <span class="badge"
            style="background: rgba(212,175,55,0.15); color: var(--hermes-gold); padding: 8px 18px; border-radius: 20px; font-weight: 600;">
            <i class="bi bi-hourglass-split me-1"></i> Próximamente
        </span>
    </div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-sm mt-4"
        style="background: var(--hermes-panel-2); border: 1px solid var(--hermes-border); color: var(--hermes-text);">
        <i class="bi bi-arrow-left me-1"></i> Volver al Dashboard
    </a>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Facturas - HERMES{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/invoices.css') }}">
{% endblock %}

{% block body_content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 style="color: #d4af37; font-weight: 700;"><i class="bi bi-file-earmark-text"></i> Facturas</h1>
        <p style="color: #999;">Gestiona y consulta todas tus facturas.</p>
    </div>
    <a href="{{ url_for('invoices_ui.create_page') }}" class="btn-gold">
        <i class="bi bi-plus-lg"></i> Nueva factura
    </a>
</div>

<div class="filtros-bar">
    <input type="text" id="buscador" class="form-control" placeholder="Buscar por numero, cliente o concepto...">
</div>

<div id="facturas-list">
    <div class="text-center py-5">
        <div class="spinner-border text-warning" role="status"></div>
        <p class="mt-3" style="color: #999;">Cargando facturas...</p>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/invoices.js') }}"></script>
{% endblock %}

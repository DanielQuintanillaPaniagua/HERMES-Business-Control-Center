{% extends "base.html" %}

{% block title %}Detalle Cliente - HERMES{% endblock %}
{% block body_class %}bg-dark-page{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/clients.css') }}">
{% endblock %}

{% block body_content %}
<div class="container-fluid clientes-page">

    <div class="mb-4">
        <a href="{{ url_for('clients_ui.list_page') }}" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left"></i> Volver a clientes
        </a>
    </div>

    <div class="detalle-cliente">
        <div class="detalle-card" id="detalle-cliente-card">
            <div class="detalle-body text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-3 text-muted">Cargando cliente...</p>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/clients.js') }}"></script>
<script>
    // Cargar el detalle del cliente al abrir la pÃ¡gina
    document.addEventListener('DOMContentLoaded', async () => {
        const clienteId = {{ cliente_id }
    };
    const cliente = await cargarCliente(clienteId);

    const contenedor = document.getElementById('detalle-cliente-card');

    if (!cliente) {
        contenedor.innerHTML = `
                <div class="detalle-body text-center py-5">
                    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
                    <h4 class="mt-3">Cliente no encontrado</h4>
                    <a href="/clients/" class="btn-gold mt-3">Volver a la lista</a>
                </div>
            `;
        return;
    }

    const badge = cliente.estado === 'Activo'
        ? '<span class="badge-activo">Activo</span>'
        : '<span class="badge-inactivo">Inactivo</span>';

    const fecha = cliente.created_at
        ? new Date(cliente.created_at).toLocaleDateString('es-ES', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        })
        : 'â€”';

    contenedor.innerHTML = `
            <div class="detalle-header">
                <h4><i class="bi bi-person-circle"></i> ${cliente.nombre}</h4>
                ${badge}
            </div>
            <div class="detalle-body">
                <div class="detalle-fila">
                    <span class="label">ID</span>
                    <span class="valor">#${cliente.id}</span>
                </div>
                <div class="detalle-fila">
                    <span class="label">Email</span>
                    <span class="valor">${cliente.email}</span>
                </div>
                <div class="detalle-fila">
                    <span class="label">TelÃ©fono</span>
                    <span class="valor">${cliente.telefono || 'â€”'}</span>
                </div>
                <div class="detalle-fila">
                    <span class="label">Ciudad</span>
                    <span class="valor">${cliente.ciudad || 'â€”'}</span>
                </div>
                <div class="detalle-fila">
                    <span class="label">Fecha de registro</span>
                    <span class="valor">${fecha}</span>
                </div>
            </div>
            <div class="detalle-footer">
                <button onclick="eliminarCliente(${cliente.id}, '${cliente.nombre}')" 
                        class="btn btn-outline-danger">
                    <i class="bi bi-trash"></i> Eliminar
                </button>
                <a href="/clients/${cliente.id}/edit" class="btn-gold">
                    <i class="bi bi-pencil"></i> Editar
                </a>
            </div>
        `;
    });
</script>
{% endblock %}

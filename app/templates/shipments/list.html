{% extends "base.html" %}

{% block title %}Envíos - HERMES{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/shipments.css') }}">
{% endblock %}

{% block body_content %}
<div class="container-fluid envios-page" data-bs-theme="dark">

    <div class="envios-header">
        <div>
            <h2><i class="bi bi-send"></i> Envíos</h2>
            <p id="total-envios">Seguimiento de envíos y entregas</p>
        </div>
        <a href="{{ url_for('shipments_ui.create_page') }}" class="btn-gold">
            <i class="bi bi-plus-circle"></i> Nuevo Envío
        </a>
    </div>

    <div id="lista-envios" class="tabla-envios">
        <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-3 text-muted">Cargando envíos...</p>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/shipments.js') }}"></script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Detalle Pedido - HERMES{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/orders.css') }}">
{% endblock %}

{% block body_content %}
<div class="container-fluid pedidos-page" data-bs-theme="dark">

    <div class="mb-4">
        <a href="{{ url_for('orders_ui.list_page') }}" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left"></i> Volver a pedidos
        </a>
    </div>

    <div class="detalle-pedido">
        <div class="detalle-card" id="detalle-pedido-card" data-pedido-id="{{ pedido_id }}">
            <div class="detalle-body text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-3 text-muted">Cargando pedido...</p>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/orders.js') }}"></script>
{% endblock %}

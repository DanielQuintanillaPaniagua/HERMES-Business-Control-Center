{% extends "base.html" %}

{% block title %}Pedidos - HERMES{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/orders.css') }}">
{% endblock %}

{% block body_content %}
<div class="container-fluid pedidos-page" data-bs-theme="dark">

    <div class="pedidos-header">
        <div>
            <h2><i class="bi bi-cart-check"></i> Pedidos</h2>
            <p>Gestión de pedidos de clientes</p>
        </div>
        <a href="{{ url_for('orders_ui.create_page') }}" class="btn-gold">
            <i class="bi bi-plus-circle"></i> Nuevo Pedido
        </a>
    </div>

    <div id="lista-pedidos" class="tabla-pedidos">
        <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-3 text-muted">Cargando pedidos...</p>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/orders.js') }}"></script>
{% endblock %}

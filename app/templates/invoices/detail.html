{% extends "base.html" %}

{% block title %}Detalle Factura - HERMES{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/invoices.css') }}">
{% endblock %}

{% block body_content %}

<div class="mb-4">
    <a href="{{ url_for('invoices_ui.list_page') }}" style="color: #999; text-decoration: none;">
        <i class="bi bi-arrow-left"></i> Volver a facturas
    </a>
</div>

<div id="detalle-factura">
    <div class="text-center py-5">
        <div class="spinner-border text-warning" role="status"></div>
        <p class="mt-3" style="color: #999;">Cargando factura...</p>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/invoices.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        cargarDetalleFactura({{ factura_id }});
    });
</script>
{% endblock %}

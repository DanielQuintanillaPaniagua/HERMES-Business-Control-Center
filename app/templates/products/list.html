{% extends "base.html" %}

{% block title %}Productos - HERMES{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/products.css') }}">
{% endblock %}

{% block body_content %}
<div class="container-fluid productos-page" data-bs-theme="dark">

    <div class="productos-header">
        <div>
            <h2><i class="bi bi-box-seam"></i> Productos</h2>
            <p>Catálogo e inventario del negocio</p>
        </div>
        <a href="{{ url_for('products_ui.create_page') }}" class="btn-gold">
            <i class="bi bi-plus-circle"></i> Nuevo Producto
        </a>
    </div>

    <div id="lista-productos" class="tabla-productos">
        <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-3 text-muted">Cargando productos...</p>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/products.js') }}"></script>
{% endblock %}
